[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inboxzerotokens"
version = "1.0.0"
description = "Your AI agents stop paying to check empty inboxes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "IndPer (Independent Perspective)" }]
keywords = ["imap", "email", "agents", "webhook", "tokens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = []

[project.optional-dependencies]
keyring = ["keyring>=23.0.0"]
dev = ["pytest==8.3.4", "ruff==0.9.9"]

[project.scripts]
izt = "inboxzerotokens.cli:main"
inboxzerotokens = "inboxzerotokens.cli:main"

[project.urls]
Homepage = "https://github.com/DivePADI/InboxZeroTokens"
Issues = "https://github.com/DivePADI/InboxZeroTokens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "E501",
    "S101",
    "S104",
    "S105",
    "S106",
    "S108",
    "S311",
    "S324",
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]
